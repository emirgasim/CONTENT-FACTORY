name: Shorts Factory Background Renderer
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Temporary project identifier
        required: true
        type: string
      phase:
        description: Research images or render approved selections
        required: true
        default: research
        type: choice
        options: [research, render]
permissions:
  contents: read
concurrency:
  group: shorts-render-${{ inputs.job_id }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Verify Cloudflare job and publish startup status
        env:
          CONTENT_FACTORY_URL: https://content-factory-7s6.pages.dev
          CF_WORKER_SECRET: ${{ secrets.CF_WORKER_SECRET }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          set -euo pipefail
          test -n "$CF_WORKER_SECRET" || { echo "::error::CF_WORKER_SECRET secret is missing"; exit 1; }
          API="$CONTENT_FACTORY_URL/api/internal/shorts/jobs/$JOB_ID"
          curl --fail --silent --show-error "$API" \
            -H "X-Factory-Worker-Secret: $CF_WORKER_SECRET" \
            -o /tmp/content-factory-job.json
          python -c 'import json; d=json.load(open("/tmp/content-factory-job.json")); assert d.get("job_id"), "Cloudflare did not return a valid job record"'
          curl --fail --silent --show-error -X PUT "$API" \
            -H "X-Factory-Worker-Secret: $CF_WORKER_SECRET" \
            -H "Content-Type: application/json" \
            --data '{"status":"processing","progress":3,"message":"Bulut işçisi başladı; çalışma ortamı hazırlanıyor."}'
          echo "Cloudflare job and worker authentication verified."
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core libsndfile1
      - name: Install renderer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "av==17.1.0" faster-whisper pillow requests httpx fastapi python-multipart
          pip install torch==2.7.0 --index-url https://download.pytorch.org/whl/cpu
          pip install transformers==4.51.3 safetensors
      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-${{ runner.os }}-v2
      - name: Render in temporary GitHub runner
        env:
          JOB_ID: ${{ inputs.job_id }}
          PHASE: ${{ inputs.phase }}
          CONTENT_FACTORY_URL: https://content-factory-7s6.pages.dev
          CF_WORKER_SECRET: ${{ secrets.CF_WORKER_SECRET }}
          ASR_MODEL_SIZE: base
          CPU_THREADS: "2"
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          FLICKR_API_KEY: ${{ secrets.FLICKR_API_KEY }}
          EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
        run: python Content-factory/voice-engine/cloud_worker.py --job-id "$JOB_ID" --phase "$PHASE"
      - name: Publish failure status if a worker step stops unexpectedly
        if: failure()
        env:
          CONTENT_FACTORY_URL: https://content-factory-7s6.pages.dev
          CF_WORKER_SECRET: ${{ secrets.CF_WORKER_SECRET }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          set +e
          API="$CONTENT_FACTORY_URL/api/internal/shorts/jobs/$JOB_ID"
          CURRENT="$(curl --silent --show-error "$API" -H "X-Factory-Worker-Secret: $CF_WORKER_SECRET" 2>/dev/null)"
          if ! printf '%s' "$CURRENT" | grep -q '"status":"failed"'; then
            curl --silent --show-error -X PUT "$API" \
              -H "X-Factory-Worker-Secret: $CF_WORKER_SECRET" \
              -H "Content-Type: application/json" \
              --data '{"status":"failed","progress":100,"message":"Bulut işçisi beklenmedik şekilde durdu. GitHub Actions günlüklerini kontrol edin."}' || true
          fi
