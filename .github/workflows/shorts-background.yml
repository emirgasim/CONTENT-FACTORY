name: Shorts Factory Background Renderer
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Temporary project identifier
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: shorts-render-${{ inputs.job_id }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core libsndfile1
      - name: Install renderer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install faster-whisper pillow requests httpx fastapi python-multipart
      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-${{ runner.os }}-v2
      - name: Render in temporary GitHub runner
        env:
          JOB_ID: ${{ inputs.job_id }}
          CONTENT_FACTORY_URL: ${{ secrets.CONTENT_FACTORY_URL }}
          CF_WORKER_SECRET: ${{ secrets.CF_WORKER_SECRET }}
          ASR_MODEL_SIZE: base
          CPU_THREADS: "2"
        run: python Content-factory/voice-engine/cloud_worker.py --job-id "$JOB_ID"
