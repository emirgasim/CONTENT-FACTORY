name: Shorts Factory Background Renderer

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: R2 job identifier (empty runs cleanup)
        required: false
        type: string
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: shorts-render-${{ github.event.inputs.job_id || github.run_id }}
  cancel-in-progress: false

jobs:
  render:
    if: github.event_name == 'workflow_dispatch' && inputs.job_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core libsndfile1
      - name: Install renderer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 botocore faster-whisper pillow requests httpx fastapi python-multipart
      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-${{ runner.os }}-v1
      - name: Render in cloud worker
        env:
          JOB_ID: ${{ inputs.job_id }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          ASR_MODEL_SIZE: base
          CPU_THREADS: "2"
        run: python Content-factory/voice-engine/cloud_worker.py --job-id "$JOB_ID"
  cleanup:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.job_id == '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cleanup dependency
        run: pip install boto3 botocore
      - name: Delete expired temporary projects
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
        run: python Content-factory/voice-engine/cloud_worker.py --cleanup --ttl-hours 24