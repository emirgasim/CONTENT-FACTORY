name: One-time Content Factory Repair Run
on:
  push:
    branches:
      - main
    paths:
      - Content-factory/voice-engine/cloud_worker.py
permissions:
  contents: read
jobs:
  retry-existing-job:
    if: github.event.head_commit.message == 'Fix runner status vocabulary in cloud worker'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core libsndfile1
      - name: Install renderer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install faster-whisper pillow requests httpx fastapi python-multipart
      - name: Retry the already-uploaded project
        env:
          JOB_ID: a73bb5ae43524fa58a60bf8f6ecef7a3
          CONTENT_FACTORY_URL: ${{ secrets.CONTENT_FACTORY_URL }}
          CF_WORKER_SECRET: ${{ secrets.CF_WORKER_SECRET }}
          ASR_MODEL_SIZE: base
          CPU_THREADS: "2"
        run: python Content-factory/voice-engine/cloud_worker.py --job-id "$JOB_ID"
