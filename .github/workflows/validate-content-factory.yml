name: Validate Content Factory

on:
  push:
    branches: [main]
    paths:
      - "Content-factory/**"
      - ".github/workflows/validate-content-factory.yml"
      - ".github/workflows/shorts-background.yml"
  pull_request:
    paths:
      - "Content-factory/**"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check frontend JavaScript
        run: node --check Content-factory/public/app.js
      - name: Check iPhone local renderer syntax
        run: node --check Content-factory/public/local-render.js
      - name: Check standalone slideshow studio script
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          page = Path('Content-factory/public/slideshow.html').read_text()
          scripts = re.findall(r'<script>(.*?)</script>', page, re.S)
          assert scripts, 'slideshow script not found'
          Path('/tmp/slideshow.js').write_text(scripts[-1])
          PY
          node --check /tmp/slideshow.js
      - name: Check autonomous editor agent script
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          page = Path('Content-factory/public/editor.html').read_text()
          scripts = re.findall(r'<script>(.*?)</script>', page, re.S)
          assert scripts, 'editor script not found'
          Path('/tmp/editor.js').write_text(scripts[-1])
          PY
          node --check /tmp/editor.js
      - name: Check Cloudflare Pages Function syntax
        run: |
          node --input-type=module --check < Content-factory/functions/api/visual-search.js
          node --input-type=module --check < Content-factory/functions/api/visual-image.js
          node --input-type=module --check < Content-factory/functions/api/agent/registry.js
          node --input-type=module --check < Content-factory/functions/api/agent/run.js
          node --input-type=module --check < Content-factory/functions/api/shorts/jobs.js
          node --input-type=module --check < 'Content-factory/functions/api/shorts/jobs/[jobId].js'
          node --input-type=module --check < 'Content-factory/functions/api/shorts/jobs/[jobId]/[asset].js'
          node --input-type=module --check < 'Content-factory/functions/api/internal/shorts/jobs/[jobId].js'
          node --input-type=module --check < 'Content-factory/functions/api/internal/shorts/jobs/[jobId]/[asset].js'
      - name: Install FFmpeg for renderer smoke tests
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install renderer test dependencies
        run: python -m pip install --disable-pip-version-check "av==17.1.0" pillow requests httpx fastapi python-multipart
      - name: Verify faster-whisper PyAV audio decoder compatibility
        run: |
          ffmpeg -hide_banner -loglevel error -f lavfi -i sine=frequency=440:duration=1 -c:a pcm_s16le /tmp/pyav-smoke.wav -y
          python - <<'PY'
          import av
          with av.open("/tmp/pyav-smoke.wav", mode="r", metadata_errors="ignore") as container:
              assert next(container.decode(audio=0), None) is not None
          print("PyAV metadata_errors audio decode: OK", av.__version__)
          PY
      - name: Check Python engine syntax and render tests
        run: |
          python -m py_compile Content-factory/voice-engine/gateway.py Content-factory/voice-engine/cloud_worker.py Content-factory/voice-engine/editing_agent.py Content-factory/voice-engine/test_editing_agent.py Content-factory/voice-engine/test_visual_fallback.py
          python -m unittest discover -s Content-factory/voice-engine -p 'test_*.py' -v
      - name: Check required application files
        run: |
          test -s Content-factory/public/index.html
          test -s Content-factory/public/style.css
          test -s Content-factory/voice-engine/Dockerfile
          test -s Content-factory/voice-engine/start.sh
          test -s Content-factory/agent/registry.json
          test -s Content-factory/agent/README.md
