name: Deploy Content Factory Voice Engine

on:
  push:
    branches: [main]
    paths:
      - "Content-factory/voice-engine/**"
      - ".github/workflows/deploy-voice-engine.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment secrets
        id: preflight
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
        run: |
          if [ -n "$HF_TOKEN" ] && [ -n "$HF_SPACE_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Hugging Face secrets are not configured; deployment skipped."
          fi
      - name: Checkout repository
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/checkout@v4
      - name: Push engine folder to Hugging Face Space
        if: steps.preflight.outputs.ready == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/hf-space
          cp -R Content-factory/voice-engine/. /tmp/hf-space/
          cd /tmp/hf-space
          git init -b main
          git config user.name "content-factory-deployer"
          git config user.email "actions@users.noreply.github.com"
          git add .
          git commit -m "Deploy Content Factory Voice Engine"
          git remote add hf "https://huggingface.co/spaces/${HF_SPACE_ID}"
          git config --global credential.helper store
          printf "https://__token__:%s@huggingface.co\n" "$HF_TOKEN" > "$HOME/.git-credentials"
          chmod 600 "$HOME/.git-credentials"
          git push --force hf main
